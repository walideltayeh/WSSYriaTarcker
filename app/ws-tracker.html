<title>WS Tracker Syria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --brand:#AB2328; --brand-deep:#8E1B20; --on-brand:#FFFFFF;
  --ground:#FAF8F6; --surface:#FFFFFF; --sunk:#F4F0EE; --raise:#FFFFFF;
  --ink:#1F1A1A; --ink-2:#5E5454; --muted:#958B89; --hair:#ECE6E3; --axis:#D8CFCC;
  --accent:#AB2328; --accent-ink:#FFFFFF; --accent-soft:#F8EDED;
  --s1:#AB2328; --s2:#AD7F22; --s3:#3D6DA8; --s4:#5B8A45; --other:#C9C1BE;
  --good:#2F7A35; --warn:#8A6300; --serious:#B4531D; --crit:#AB2328;
  --good-bg:#EDF5EC; --warn-bg:#FAF2DE; --serious-bg:#FBEDE4; --crit-bg:#F8EDED;
  --m1:#F7E6E6; --m2:#EABDBF; --m3:#D07C80; --m4:#AB2328; --m5:#6E1217;
  --m1t:#1F1A1A; --m2t:#1F1A1A; --m3t:#FFFFFF; --m4t:#FFFFFF; --m5t:#FFFFFF;
  --shadow:0 1px 2px rgba(31,26,26,.05),0 10px 30px rgba(31,26,26,.07);
  --display:"Jost","Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Jost","Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#121010; --surface:#1A1717; --sunk:#151212; --raise:#221E1E;
    --ink:#F4EFED; --ink-2:#CBC2C0; --muted:#948A88; --hair:#2C2626; --axis:#3B3333;
    --accent:#E0565B; --accent-ink:#121010; --accent-soft:#34191B;
    --s1:#D4474D; --s2:#BD8B2C; --s3:#4F86D6; --s4:#6A9B53; --other:#4A4242;
    --good:#5BBF62; --warn:#E8B64A; --serious:#EE8C5A; --crit:#EE6A6F;
    --good-bg:#16261A; --warn-bg:#2C2414; --serious-bg:#2E1C13; --crit-bg:#34191B;
    --m1:#321C1D; --m2:#5E2327; --m3:#9A2F35; --m4:#D4474D; --m5:#F2B3B5;
    --m1t:#F4EFED; --m2t:#FFFFFF; --m3t:#FFFFFF; --m4t:#121010; --m5t:#121010;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#121010; --surface:#1A1717; --sunk:#151212; --raise:#221E1E;
  --ink:#F4EFED; --ink-2:#CBC2C0; --muted:#948A88; --hair:#2C2626; --axis:#3B3333;
  --accent:#E0565B; --accent-ink:#121010; --accent-soft:#34191B;
  --s1:#D4474D; --s2:#BD8B2C; --s3:#4F86D6; --s4:#6A9B53; --other:#4A4242;
  --good:#5BBF62; --warn:#E8B64A; --serious:#EE8C5A; --crit:#EE6A6F;
  --good-bg:#16261A; --warn-bg:#2C2414; --serious-bg:#2E1C13; --crit-bg:#34191B;
  --m1:#321C1D; --m2:#5E2327; --m3:#9A2F35; --m4:#D4474D; --m5:#F2B3B5;
  --m1t:#F4EFED; --m2t:#FFFFFF; --m3t:#FFFFFF; --m4t:#121010; --m5t:#121010;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:26px;font-weight:400;line-height:1.25}
h3{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-2)}
[lang="ar"] h3,[dir="rtl"] h3{letter-spacing:0;font-size:14px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:13px}
.ar{unicode-bidi:isolate}

/* header: the logo sits on the exact brand red */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand)}
.top-in{max-width:1160px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:18px;min-height:68px}
.logo{height:52px;width:auto;display:block;flex:none}
.brand{display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;padding-inline-start:16px;border-inline-start:1px solid rgba(255,255,255,.35)}
.brand h1{font-size:14px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.brand span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.75;white-space:nowrap}
[dir="rtl"] .brand h1,[dir="rtl"] .brand span{letter-spacing:0}
.tabs{display:flex;gap:4px;margin-inline-start:auto;align-self:stretch}
.tabs a{display:flex;align-items:center;padding:0 12px;color:rgba(255,255,255,.72);text-decoration:none;font-size:12.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;border-bottom:2px solid transparent}
[dir="rtl"] .tabs a{letter-spacing:0;font-size:14px}
.tabs a:hover{color:#fff}
.tabs a[aria-current="page"]{color:#fff;border-bottom-color:#fff}
.tabs a:focus-visible,.lang:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.btn:focus-visible,.row-link:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;align-items:center;gap:10px}
.lang{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:var(--r);padding:4px 10px;font-size:13px;font-weight:500;cursor:pointer}
.lang:hover{background:rgba(255,255,255,.12)}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.85);max-width:170px}
.me img{width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:34px 120px;display:grid;gap:30px}
.bottom{display:none}
@media (max-width:860px){
  .tabs{display:none}
  .brand span{display:none}
  .me span{display:none}
  .logo{height:46px}
  .top-in{min-height:60px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottom a{display:grid;justify-items:center;gap:3px;padding:10px 0 11px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
  [dir="rtl"] .bottom a{letter-spacing:0;font-size:11.5px}
  .bottom a svg{width:21px;height:21px;stroke-width:1.5}
  .bottom a[aria-current="page"]{color:var(--brand)}
}

/* generic */
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:20px}
.panel.flush{padding:0;overflow:hidden}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.head .sub{color:var(--muted);font-size:14px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--axis);background:var(--surface);border-radius:var(--r);padding:9px 16px;font-size:12.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
[dir="rtl"] .btn{letter-spacing:0;font-size:14px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.big{padding:13px 22px;font-size:13px}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:1px 9px 1px 7px;border-radius:999px;white-space:nowrap;line-height:1.7;letter-spacing:.02em}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-good{color:var(--good);background:var(--good-bg)} .c-warn{color:var(--warn);background:var(--warn-bg)}
.c-serious{color:var(--serious);background:var(--serious-bg)} .c-crit{color:var(--crit);background:var(--crit-bg)}
.c-acc{color:var(--accent);background:var(--accent-soft)} .c-mute{color:var(--muted);background:var(--sunk)}
.notice{padding:13px 16px;border-radius:var(--r);background:var(--accent-soft);font-size:14px;border-inline-start:2px solid var(--accent)}
.notice.warn{background:var(--warn-bg);border-color:var(--warn)}
.notice.crit{background:var(--crit-bg);border-color:var(--crit)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r)}
.kpi{padding:18px 20px;display:grid;gap:4px;border-inline-end:1px solid var(--hair)}
.kpi:last-child{border-inline-end:0}
.kpi b{font-family:var(--display);font-size:32px;font-weight:300;line-height:1.1;letter-spacing:-.01em}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
[dir="rtl"] .kpi span{letter-spacing:0;font-size:12.5px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;font-weight:500;color:var(--muted);text-align:start;padding:12px 14px;border-bottom:1px solid var(--axis);white-space:nowrap;vertical-align:bottom;text-transform:uppercase;letter-spacing:.1em}
[dir="rtl"] th{letter-spacing:0;font-size:12px}
td{padding:12px 14px;border-bottom:1px solid var(--hair);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:1px solid var(--ink-2);border-bottom:0;font-weight:500}
.r{text-align:end}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.name{font-weight:500}
.sub2{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.inbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.inbar i{display:block;height:4px;border-radius:2px;background:var(--brand);min-width:2px}
.field{display:grid;gap:5px}
.field label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.12em}
[dir="rtl"] .field label{letter-spacing:0;font-size:12.5px}
.inp{border:1px solid var(--axis);background:var(--surface);border-radius:var(--r);padding:10px 12px;width:100%}
.inp:focus{border-color:var(--accent)}
.search{max-width:360px}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* wholesaler list */
.wslist{display:grid}
.row-link{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--hair);text-decoration:none;color:inherit}
.row-link:last-child{border-bottom:0}
.row-link:hover{background:var(--sunk)}
.row-link .n{font-weight:500;font-size:16px}
.row-link .m{font-size:12.5px;color:var(--muted);grid-column:1}
.row-link .x{grid-row:1/span 2;grid-column:2;display:grid;justify-items:end;gap:5px}

/* count form */
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
[dir="rtl"] .crumbs{letter-spacing:0;font-size:13px}
.crumbs a{color:var(--accent);text-decoration:none}
.wshead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.wshead h2{font-size:30px;font-weight:400}
.form-top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.lines{display:grid}
.line{display:grid;grid-template-columns:1fr 116px;gap:6px 16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--hair)}
.line:last-child{border-bottom:0}
.line .pn{font-weight:500}
.line .pa{font-size:12.5px;color:var(--muted)}
.line .meta{grid-column:1;font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 14px}
.line .qty{grid-row:1/span 2;grid-column:2;display:grid;gap:4px}
.line .qty input{text-align:center;font-size:20px;font-weight:400;padding:10px 6px;border-radius:var(--r);border:1px solid var(--axis);background:var(--surface);width:100%}
.line .qty input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.line .pv{font-size:12px;text-align:center;min-height:18px}
.line .pv.neg{color:var(--crit);font-weight:500}
.sticky-save{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 18px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow)}
@media (min-width:861px){.sticky-save{bottom:14px}}
.hist details{border-bottom:1px solid var(--hair)}
.hist details:last-child{border-bottom:0}
.hist summary{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:14px 20px;cursor:pointer;list-style:none}
.hist summary::-webkit-details-marker{display:none}
.hist summary .d{font-weight:500;min-width:100px}
.hist summary .who{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.hist summary .who img{width:20px;height:20px;border-radius:50%}
.hist .acts{display:flex;gap:6px;margin-inline-start:auto}
.hist .body{padding:0 10px 14px}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--body);fill:var(--muted);font-size:12px}
.chart .val{fill:var(--ink-2);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2);list-style:none;margin:0;padding:0}
.legend li{display:flex;align-items:center;gap:7px}
.sw{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:14px;align-items:center;font-size:14px}
.hbar .lab{text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{display:flex;align-items:center;gap:10px;min-width:0}
.hbar .bar{height:10px;border-radius:0 2px 2px 0;background:var(--brand);flex:none}
[dir="rtl"] .hbar .bar{border-radius:2px 0 0 2px}
.hbar.other .bar{background:var(--other)}
.hbar .v{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.matrix{border-collapse:separate;border-spacing:2px;font-size:12px;width:auto}
.matrix th{border:0;padding:4px 2px;font-size:10.5px;text-align:center;white-space:normal;line-height:1.3;width:54px;vertical-align:bottom;color:var(--ink-2);text-transform:none;letter-spacing:0}
.matrix th.grp{color:var(--ink);font-size:12px;font-weight:500;letter-spacing:.12em;border-bottom:1px solid var(--axis)}
.matrix th.rowh{text-align:end;width:auto;padding-inline-end:12px;font-size:13px;color:var(--ink);font-weight:500;white-space:nowrap;vertical-align:middle}
.matrix td{border:0;padding:0;width:54px;height:28px;text-align:center;border-radius:2px;background:var(--sunk);color:var(--muted)}
.matrix td.b1{background:var(--m1);color:var(--m1t)} .matrix td.b2{background:var(--m2);color:var(--m2t)} .matrix td.b3{background:var(--m3);color:var(--m3t)} .matrix td.b4{background:var(--m4);color:var(--m4t)} .matrix td.b5{background:var(--m5);color:var(--m5t)}
.dot{display:block;margin:4px auto 0;width:6px;height:6px;border-radius:50%}
.dot.in{background:var(--good)} .dot.out{border:1.5px solid var(--muted)}
.meter{position:relative;height:4px;border-radius:2px;background:var(--sunk);min-width:90px}
.meter i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:2px;background:var(--ink-2)}
.meter.low i{background:var(--crit)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--raise);color:var(--ink);border:1px solid var(--hair);box-shadow:var(--shadow);border-radius:var(--r);padding:9px 12px;font-size:12.5px;line-height:1.55;min-width:160px}
#tip .t{font-weight:500;margin-bottom:3px}
#tip .rw{display:flex;justify-content:space-between;gap:14px;align-items:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:var(--r);font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.stack{display:grid;gap:14px}
.pushcard{display:grid;gap:7px;padding:16px 20px;border-bottom:1px solid var(--hair)}
.pushcard:last-child{border-bottom:0}
.pushcard .top1{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.pushcard .rs{font-size:13.5px;color:var(--ink-2)}
.pushcard .sg{font-size:13px;padding:7px 12px;border-inline-start:2px solid var(--brand);background:var(--accent-soft)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);align-items:center}
.mlegend>span{display:inline-flex;align-items:center;gap:6px}
.mkt tr.grp td{background:var(--sunk);font-weight:500}
.mkt .ind{display:block;padding-inline-start:18px}
.skel{height:12px;border-radius:2px;background:var(--sunk);margin:10px 0}
@media (prefers-reduced-motion: no-preference){.row-link,.btn,.tabs a{transition:background .15s,color .15s,border-color .15s}}
.nt{text-transform:none;letter-spacing:0}
.mkt td:first-child{min-width:230px}
.mkt td .muted.small,.mkt td.muted{white-space:nowrap}
.pushcard a.name{text-decoration:none;font-size:16px}
.nextgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}
.nextcard{display:grid;gap:8px;align-content:start;padding:18px 20px;border-bottom:1px solid var(--hair);border-inline-end:1px solid var(--hair)}
.nextcard .top1{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.nextcard a.name{text-decoration:none;color:inherit;font-size:16px}
.nextcard .rs{font-size:13px;color:var(--ink-2)}
.nextcard .cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 24px;margin-top:4px}
.colh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding-bottom:5px;border-bottom:1px solid var(--axis)}
[dir="rtl"] .colh{letter-spacing:0;font-size:12px}
.colh b{color:var(--ink);font-size:13px;letter-spacing:0}
.colh.sub{margin-top:10px}
.when{font-size:12.5px;color:var(--ink-2);padding:5px 0 3px}
.pl{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--hair);font-size:13px}
.pl b{font-weight:500}
.pn2{display:block;color:var(--muted);font-size:12px}
.pushcard a.name:hover{color:var(--accent)!important}
</style>

<header class="top"><div class="top-in">
  <div class="logo" style="display:grid;place-items:center;width:52px;height:52px;border:1px solid rgba(255,255,255,.55);border-radius:4px;font-size:15px;font-weight:500;letter-spacing:.08em">WS</div><div class="brand"><h1 id="brand">WS Tracker</h1><span id="brandsub">Syria</span></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="tools"><button class="lang" id="langBtn" type="button" aria-label="Switch language">ع</button></div>
</div></header>
<main id="main" aria-live="polite"></main>
<nav class="bottom" id="bottom" aria-label="Sections"></nav>
<div id="tip" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
/* ============================== i18n ============================== */
const T = {

    const [si, date, type, ws, , , out] = r;

  const w = E.wsById.get(id);
  if (!w) { main.innerHTML = `<div class="notice">${esc(t("notCounted"))}</div>`; return; }
  const counted = w.skuRows.filter((r) => r.counted || r.everDel > 0).sort((a, b) => FORMATS.indexOf(fmtOf(a.sku)) - FORMATS.indexOf(fmtOf(b.sku)) || b.counted - a.counted);
  const fmtTiles = FORMATS.map((f) => ({ f, a: agg(w.skuRows.filter((r) => fmtOf(r.sku) === f)) })).filter((x) => x.a.counted);
  main.innerHTML = `
    <div class="crumbs"><a href="#">${esc(t("back"))}</a><span>/</span></div>
    <div class="wshead"><div class="stack" style="gap:4px"><h2><span dir="auto">${esc(w.name)}</span></h2>
      <p class="small muted">${w.lastCount ? `${esc(t("lastCount"))}: ${fmtDate(w.lastCount.date)} · ${esc(t("daysAgo", w.daysSinceCount))}` : esc(t("never"))} · ${esc(t("lastDel"))}: ${w.lastDel ? fmtDate(w.lastDel) : esc(t("neverDel"))}</p></div>
      <a class="btn pri big" href="#ws/${w.id}/count">${esc(t("countNow"))}</a></div>
    ${w.lastCount ? `<div class="kpis">
      <div class="kpi"><b class="num">${fmt(w.delTo)}</b><span>${esc(t("delToDate"))}</span></div>
      <div class="kpi"><b class="num">${fmt(w.stock)}</b><span>${esc(t("stock"))}</span></div>
      <div class="kpi"><b class="num">${fmt(w.offToDate)}</b><span>${esc(t("offtake"))}</span></div>
      <div class="kpi"><b class="num">${pct(w.delTo ? w.offToDate / w.delTo : null)}</b><span>${esc(t("sellThrough"))}</span></div>
      <div class="kpi"><b class="num">${fmt1(w.rate)}</b><span>${esc(t("perDay"))}</span></div></div>` : ""}
    ${w.lastCount && w.uncounted ? `<p class="small muted">${esc(t("partial", w.uncounted))}</p>` : ""}
    ${w.flags ? `<div class="notice warn">${esc(t("flags"))}: ${w.flags} — ${esc(t("checkNeg"))}</div>` : ""}
    ${fmtTiles.length ? `<section class="stack"><h3>${esc(t("byFmtWs"))}</h3><div class="kpis">${fmtTiles.map((x) => `<div class="kpi"><b class="num">${fmt(x.a.off)}</b><span><span class="nt">${esc(t("f_" + x.f))}</span> · ${esc(t("stock"))} ${fmt(x.a.stock)} · ${pct(x.a.delTo ? x.a.off / x.a.delTo : null)}</span></div>`).join("")}</div></section>` : ""}
    ${w.lastCount ? `<section class="stack"><h3>${esc(t("byProduct"))}</h3><div class="panel flush scroll">${skuTable(w, counted)}</div><p class="small muted">${esc(t("estNote"))}</p></section>` : ""}
    ${nextBlock(w)}
    ${purchaseSection(w)}
    <section class="stack"><h3>${esc(t("history"))}</h3><div class="panel flush hist" id="hist">${histHTML(w)}</div></section>`;
  bindPurchases(w);
  bindHistory(w);
}
function skuTable(w, rows) {
  const body = rows.map((r) => {
    if (!r.counted) return `<tr><td><span class="name">${esc(skuName(r.sku))}</span><span class="sub2">${esc(skuAlt(r.sku))}</span></td><td class="small">${esc(t("f_" + fmtOf(r.sku)))}</td><td class="r num">${fmt(r.everDel)}</td><td class="r muted" colspan="5">${esc(t("notCounted"))}</td></tr>`;
    const low = r.daysLeft != null && r.daysLeft < settings().lowDays;
    return `<tr><td><span class="name">${esc(skuName(r.sku))}</span><span class="sub2">${esc(skuAlt(r.sku))}</span></td><td class="small">${esc(t("f_" + fmtOf(r.sku)))}</td>
      <td class="r num">${fmt(r.delTo)}</td><td class="r num"><b>${fmt(r.stock)}</b></td>
      <td class="r num">${r.flag ? `<span class="chip c-crit">${fmt(r.offToDate)}</span>` : fmt(r.offToDate)}</td>
      <td class="r num">${pct(r.delTo ? r.offToDate / r.delTo : null)}</td><td class="r num">${fmt1(r.rate)}</td>
      <td class="r num">${r.daysLeft == null ? "—" : low ? `<span class="chip c-crit">${fmt(r.daysLeft)}</span>` : fmt(r.daysLeft)}</td></tr>`;
  }).join("");
  return `<table><thead><tr><th>${esc(t("product"))}</th><th>${esc(t("format"))}</th><th class="r">${esc(t("delToDate"))}</th><th class="r">${esc(t("stock"))}</th><th class="r">${esc(t("offtake"))}</th><th class="r">${esc(t("sellThrough"))}</th><th class="r">${esc(t("perDay"))}</th><th class="r">${esc(t("daysLeft"))}</th></tr></thead><tbody>${body}</tbody></table>`;
}
// Every sales-invoice line delivered to this wholesaler, by date or by product.
function purchaseLines(w) {
  if (!S.ledger) return [];
  const ls = S.ledger.skus;
  return S.ledger.rows.filter((r) => r[2] === "Sales Invoice" && aliasOf(r[3]) === w.name && r[6] > 0)
    .map((r) => ({ date: r[1], sku: ls[r[0]], ref: r[4], qty: r[6] }))
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}
function purchaseSection(w) {
  const rows = purchaseLines(w);
  if (!rows.length) return "";
  const mode = S.phMode || "date";
  const total = rows.reduce((a, r) => a + r.qty, 0);
  const days = [...new Set(rows.map((r) => r.date))];
  const gaps = days.slice().sort().slice(1).map((d, i) => dayDiff(days.slice().sort()[i], d));
  const avgGap = gaps.length ? Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length) : null;
  let body;
  if (mode === "date") {
    body = `<table><thead><tr><th>${esc(t("date"))}</th><th>${esc(t("product"))}</th><th>${esc(t("format"))}</th><th>${esc(t("ref"))}</th><th class="r">${esc(t("units"))}</th></tr></thead><tbody>`;
    let last = null;
    for (const r of rows) {
      const first = r.date !== last; last = r.date;
      const dayTotal = first ? rows.filter((x) => x.date === r.date).reduce((a, x) => a + x.qty, 0) : 0;
      body += `<tr${first ? ' style="border-top:1px solid var(--axis)"' : ""}><td class="small num" style="white-space:nowrap">${first ? fmtDate(r.date) + (dayTotal ? ` <span class="muted">· ${fmt(dayTotal)}</span>` : "") : ""}</td>
        <td><span class="name">${esc(skuName(r.sku))}</span><span class="sub2">${esc(skuAlt(r.sku))}</span></td>
        <td class="small nt">${esc(t("f_" + fmtOf(r.sku)))}</td><td class="small muted">${esc(r.ref || "—")}</td><td class="r num"><b>${fmt(r.qty)}</b></td></tr>`;
    }
    body += `</tbody><tfoot><tr><td colspan="4">${esc(t("total"))} · ${rows.length} ${esc(t("linesN"))}</td><td class="r num">${fmt(total)}</td></tr></tfoot></table>`;
  } else {
    const per = new Map();
    for (const r of rows) { const k = r.sku.id; const p = per.get(k) || { sku: r.sku, qty: 0, n: 0, first: r.date, last: r.date }; p.qty += r.qty; p.n++; p.first = p.first < r.date ? p.first : r.date; p.last = p.last > r.date ? p.last : r.date; per.set(k, p); }
    const list = [...per.values()].sort((a, b) => b.qty - a.qty);
    body = `<table><thead><tr><th>${esc(t("product"))}</th><th>${esc(t("format"))}</th><th class="r">${esc(t("linesN"))}</th><th>${esc(t("firstOrder"))}</th><th>${esc(t("lastOrder"))}</th><th class="r">${esc(t("units"))}</th><th class="r">${esc(t("shareOfWs"))}</th></tr></thead><tbody>`
      + list.map((p) => `<tr><td><span class="name">${esc(skuName(p.sku))}</span><span class="sub2">${esc(skuAlt(p.sku))}</span></td><td class="small nt">${esc(t("f_" + fmtOf(p.sku)))}</td>
        <td class="r num">${p.n}</td><td class="small num">${fmtShort(p.first)}</td><td class="small num">${fmtShort(p.last)}</td><td class="r num"><b>${fmt(p.qty)}</b></td><td class="r num">${pct(p.qty / total)}</td></tr>`).join("")
      + `</tbody><tfoot><tr><td colspan="5">${esc(t("total"))}</td><td class="r num">${fmt(total)}</td><td></td></tr></tfoot></table>`;
  }
  return `<section class="stack"><div class="head"><h3>${esc(t("purchases"))}</h3>
      <div class="seg" role="group"><button type="button" data-ph="date" aria-pressed="${mode === "date"}">${esc(t("byDate"))}</button><button type="button" data-ph="sku" aria-pressed="${mode === "sku"}">${esc(t("byProductT"))}</button></div></div>
    <p class="small muted">${esc(t("purchasesSub"))} · ${rows.length} ${esc(t("linesN"))} · ${days.length} ${esc(t("orderDays"))}${avgGap ? " · " + esc(t("everyDays", avgGap)) : ""} · ${fmt(total)} ${esc(t("units"))}</p>
    <div class="panel chart stack"><h3>${esc(t("monthlyBuy"))}</h3><div id="cBuy"></div></div>
    <div class="panel flush scroll">${body}</div></section>`;
}
function bindPurchases(w) {
  document.querySelectorAll("[data-ph]").forEach((b) => b.addEventListener("click", () => { S.phMode = b.dataset.ph; render(); }));
  const host = document.getElementById("cBuy");
  if (!host) return;
  const rows = purchaseLines(w), M = E.months;
  const byF = Object.fromEntries(FORMATS.map((x) => [x, M.map(() => 0)]));
  for (const r of rows) { const i = M.indexOf(r.date.slice(0, 7)); if (i >= 0) byF[fmtOf(r.sku)][i] += r.qty; }
  drawStacked(host, M, FORMATS.map((x, i) => ({ label: t("f_" + x), color: `--s${i + 1}`, values: byF[x] })), t("monthlyBuy"));
}
function histHTML(w) {
  if (!w.counts.length) return `<p style="padding:16px" class="muted">${esc(t("noHistory"))}</p>`;
  const bySku = new Map(w.skuRows.map((r) => [r.sku.id, r]));
  return [...w.counts].reverse().map((c) => {
    const lines = E.skus.map((s) => {
      const p = bySku.get(s.id).series.find((x) => x.id === c.id);
      return p ? { s, p } : null;
    }).filter(Boolean);
    const offSum = lines.reduce((a, l) => a + l.p.off, 0), stockSum = lines.reduce((a, l) => a + l.p.v, 0);
    const canDel = S.canWrite !== false;
    return `<details><summary><span class="d">${fmtDate(c.date)}</span>
      <span class="small ink2 num">${esc(t("stock"))} ${fmt(stockSum)} · ${esc(t("offtake"))} ${fmt(offSum)}</span>
      <span class="who">${c.supervisorName ? esc(t("by")) + " " + esc(c.supervisorName) : ""}</span>
      <span class="acts">${S.canWrite !== false ? `<a class="btn ghost" href="#ws/${w.id}/count/${esc(c.id)}">${esc(t("edit"))}</a>` : ""}${canDel && S.canWrite !== false ? `<button class="btn ghost danger" type="button" data-del="${esc(c.id)}">${esc(S.pendingDelete === c.id ? t("delConfirm") : t("del"))}</button>` : ""}</span></summary>
      <div class="body scroll"><table><thead><tr><th>${esc(t("product"))}</th><th class="r">${esc(t("prevCount"))}</th><th class="r">${esc(t("received"))}</th><th class="r">${esc(t("counted"))}</th><th class="r">${esc(t("offtake"))}</th><th class="r">${esc(t("period"))}</th></tr></thead><tbody>
      ${lines.map(({ s, p }) => `<tr><td>${esc(skuName(s))}</td><td class="r num">${p.base ? "0" : fmt(p.prevV)}</td><td class="r num">${fmt(p.rec)}</td><td class="r num"><b>${fmt(p.v)}</b></td><td class="r num">${p.off < 0 ? `<span class="chip c-crit">${fmt(p.off)}</span>` : fmt(p.off)}</td><td class="r num small muted">${p.days == null ? "—" : p.days + "d"}</td></tr>`).join("")}
      </tbody></table>${c.note ? `<p class="small ink2" style="padding:8px 4px 0" dir="auto"></p>` : ""}</div></details>`;
  }).join("");
}
function bindHistory(w) {
  const host = document.getElementById("hist");
  // notes via textContent (shared, untrusted)
  const notes = host.querySelectorAll("details p[dir=auto]");
  let i = 0; for (const c of [...w.counts].reverse()) if (c.note) { if (notes[i]) notes[i].textContent = c.note; i++; }
  host.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async (e) => {
    e.preventDefault(); e.stopPropagation();
    const id = b.dataset.del;
    if (S.pendingDelete !== id) { S.pendingDelete = id; b.textContent = t("delConfirm"); return; }
    S.pendingDelete = null;
    try { await S.db.doc("counts/" + id).delete(); toast(t("deleted")); } catch (err) { toast(t("err") + (err.code || err.message)); }
  }));
}
/* ---------- count form ---------- */
function viewCount(main, id, editId) {
  const w = E.wsById.get(id);
  if (!w) { main.innerHTML = ""; return; }
  const editing = editId ? w.counts.find((c) => c.id === editId) : null;
  if (!S.form || S.form.ws !== id || S.form.editId !== (editId || null)) {
    let draft = null; try { draft = JSON.parse(store.get("wst_draft_" + id + (editId ? "_" + editId : "")) || "null"); } catch (e) {}
    S.form = draft || { ws: id, editId: editId || null, date: editing ? editing.date : todayISO(), note: editing?.note || "", stock: editing ? { ...editing.stock } : {} };
    S.form.ws = id; S.form.editId = editId || null;
  }
  const f = S.form;
  const skus = E.skus.filter((s) => S.showAllSkus || (w.skuRows.find((r) => r.sku.id === s.id).everDel > 0) || f.stock[s.id] != null || w.skuRows.find((r) => r.sku.id === s.id).counted);
  main.innerHTML = `
    <div class="crumbs"><a href="#">${esc(t("back"))}</a><span>/</span><a href="#ws/${w.id}" class="ar" dir="auto"></a></div>
    <div class="head"><h2>${esc(t("countTitle"))}</h2>
      <div class="form-top"><div class="field"><label for="fdate">${esc(t("date"))}</label><input class="inp" type="date" id="fdate" value="${esc(f.date)}" max="${todayISO()}"></div></div></div>
    ${S.canWrite === false ? `<div class="notice warn">${esc(t("readOnly"))}</div>` : ""}
    <p class="small ink2">${esc(t("countHint"))}</p>
    <div id="fwarn"></div>
    <div class="panel flush"><div class="lines" id="lines">${skus.map((s) => `
      <div class="line" data-sku="${s.id}"><div><div class="pn">${esc(skuName(s))}</div><div class="pa">${esc(skuAlt(s))}</div></div>
        <div class="meta" data-meta></div>
        <div class="qty"><input inputmode="decimal" type="number" min="0" step="any" aria-label="${esc(skuName(s))}" data-in="${s.id}" value="${f.stock[s.id] ?? ""}"><div class="pv" data-pv></div></div>
      </div>`).join("")}</div></div>
    <button class="btn ghost" type="button" id="toggleAll">${esc(S.showAllSkus ? t("showMine") : t("showAll"))}</button>
    <div class="grid2" style="gap:12px"><div class="field"><label for="fsup">${esc(t("supName"))}</label><input class="inp" id="fsup" dir="auto" autocomplete="name" value="${esc(S.sup || "")}"></div>
    <div class="field"><label for="fnote">${esc(t("note"))}</label><textarea class="inp" id="fnote" rows="2" dir="auto"></textarea></div></div>
    <div class="sticky-save"><span class="small ink2" id="fsum"></span><div style="display:flex;gap:8px"><a class="btn" href="#ws/${w.id}">${esc(t("cancel"))}</a><button class="btn pri big" type="button" id="fsave" ${S.canWrite === false ? "disabled" : ""}>${esc(t("save"))}</button></div></div>`;
  main.querySelector(".crumbs a.ar").textContent = w.name;
  document.getElementById("fnote").value = f.note || "";
  const persist = () => { S.dirty = true; store.set("wst_draft_" + id + (editId ? "_" + editId : ""), JSON.stringify(f)); };
  const update = () => {
    let off = 0, blanks = 0;
    for (const s of skus) {
      const line = main.querySelector(`.line[data-sku="${s.id}"]`);
      const prev = [...(w.skuRows.find((r) => r.sku.id === s.id).series)].filter((p) => p.date < f.date && p.id !== (editId || "")).at(-1);
      const delTo = E.cum(id, s.id, f.date), prevDel = prev ? E.cum(id, s.id, prev.date) : 0;
      const rec = delTo - prevDel;
      line.querySelector("[data-meta]").innerHTML = prev
        ? `<span>${esc(t("last"))}: <b class="num">${fmt(prev.v)}</b> · ${fmtShort(prev.date)}</span><span>${esc(t("delSince"))}: <b class="num">${fmt(rec)}</b></span>`
        : `<span>${esc(t("delToDate"))}: <b class="num">${fmt(rec)}</b></span>`;
      const v = f.stock[s.id];
      const pv = line.querySelector("[data-pv]");
      if (v == null) { pv.textContent = ""; pv.className = "pv"; if (rec > 0 || (prev && prev.v > 0)) blanks++; continue; }
      const o = (prev ? prev.v : 0) + rec - v;
      off += Math.max(0, o);
      pv.textContent = o < 0 ? t("checkNeg") : `${t("offPreview")}: ${fmt(o)}`;
      pv.className = "pv" + (o < 0 ? " neg" : " muted");
    }
    const exists = w.counts.find((c) => c.date === f.date && c.id !== editId);
    document.getElementById("fwarn").innerHTML = (exists ? `<div class="notice warn">${esc(t("overwrite"))}</div>` : "") + (blanks ? `<div class="notice warn" style="margin-top:8px">${esc(t("blankWarn", blanks))}</div>` : "");
    document.getElementById("fsum").textContent = `${t("offtake")}: ${fmt(off)}`;
  };
  update();
  main.querySelectorAll("[data-in]").forEach((inp) => inp.addEventListener("input", () => {
    const v = inp.value.trim(); const n = Number(v);
    if (v === "" || !isFinite(n) || n < 0) delete f.stock[inp.dataset.in]; else f.stock[inp.dataset.in] = Math.round(n * 100) / 100;
    persist(); update();
  }));
  document.getElementById("fdate").addEventListener("change", (e) => { if (e.target.value) { f.date = e.target.value; persist(); update(); } });
  document.getElementById("fnote").addEventListener("input", (e) => { f.note = e.target.value; persist(); });
  document.getElementById("fsup").addEventListener("input", (e) => { S.sup = e.target.value.slice(0, 60); store.set("wst_sup", S.sup); });
  main.querySelector(".sticky-save a.btn").addEventListener("click", () => { store.set("wst_draft_" + id + (editId ? "_" + editId : ""), null); S.dirty = false; S.form = null; });
  document.getElementById("toggleAll").addEventListener("click", () => { S.showAllSkus = !S.showAllSkus; const d = S.dirty; S.dirty = false; render(); S.dirty = d; });
  document.getElementById("fsave").addEventListener("click", async (e) => {
    const btn = e.currentTarget; if (btn.disabled) return;
    const stock = Object.fromEntries(Object.entries(f.stock).filter(([, v]) => typeof v === "number" && isFinite(v)));
    if (!Object.keys(stock).length) { toast(t("enterOne")); return; }
    btn.disabled = true; btn.textContent = t("saving");
    const docId = `${id}_${f.date}`;
    const body = { ws: id, wsName: w.name, date: f.date, stock, note: (f.note || "").slice(0, 500), supervisorName: (S.sup || "").slice(0, 60), savedAt: new Date().toISOString() };
    try {
      await S.db.doc("counts/" + docId).set(body);
      if (editId && editId !== docId) await S.db.doc("counts/" + editId).delete();
      store.set("wst_draft_" + id + (editId ? "_" + editId : ""), null);
      S.dirty = false; S.form = null; toast(t("saved")); go("#ws/" + id);
    } catch (err) {
      btn.disabled = false; btn.textContent = t("save");
      if (err && err.code === "invalid_argument") { S.canWrite = false; toast(t("noWrite")); } else toast(t("err") + (err?.code || err?.message || err));
    }
  });
}

/* ---------- offtake ---------- */
// Sum a set of wholesaler×SKU rows into one offtake figure (only rows that have a count).
function agg(rows) {
  const c = rows.filter((r) => r.counted);
  return {
    counted: c.length > 0, n: c.length,
    delTo: c.reduce((a, r) => a + r.delTo, 0), stock: c.reduce((a, r) => a + r.stock, 0), off: c.reduce((a, r) => a + r.offToDate, 0),
    rate: c.some((r) => r.rate != null) ? c.reduce((a, r) => a + (r.rate || 0), 0) : null, est: c.reduce((a, r) => a + (r.estNow || 0), 0),
    flags: c.filter((r) => r.flag).length, everDel: rows.reduce((a, r) => a + r.everDel, 0),
    last: c.reduce((m, r) => (r.lastDate > m ? r.lastDate : m), ""),
  };
}
const predOf = (sel) => (sel === "all" ? () => true : sel.startsWith("fmt:") ? (r) => fmtOf(r.sku) === sel.slice(4) : (r) => r.sku.id === sel);
const selName = (sel) => (sel === "all" ? t("allProducts") : sel.startsWith("fmt:") ? t("f_" + sel.slice(4)) : skuName(E.skus.find((s) => s.id === sel)));
const allRows = (pred) => E.wsList.flatMap((w) => w.skuRows.filter(pred));
const wsCountFor = (pred) => E.wsList.filter((w) => w.skuRows.some((r) => r.counted && pred(r))).length;

function viewOfftake(main) {
  const sel = S.sku, pred = predOf(sel), lowD = settings().lowDays;
  const list = E.wsList.map((w) => ({ w, v: agg(w.skuRows.filter(pred)) })).filter((x) => x.v.counted || x.v.everDel > 0);
  const c = list.filter((x) => x.v.counted).sort((a, b) => b.v.off - a.v.off);
  const nc = list.filter((x) => !x.v.counted).sort((a, b) => b.v.everDel - a.v.everDel);
  const tot = agg(allRows(pred));
  const max = Math.max(1, ...c.map((x) => x.v.off));
  main.innerHTML = `
    <div class="head"><div><h2>${esc(t("offTitle"))}</h2><p class="sub" style="max-width:70ch">${esc(t("offSub"))}</p></div>
      <div class="field"><label for="skuSel">${esc(t("show"))}</label><select class="inp" id="skuSel" style="min-width:240px">
        <option value="all">${esc(t("allProducts"))}</option>
        <optgroup label="${esc(t("format"))}">${FORMATS.map((f) => `<option value="fmt:${f}" ${sel === "fmt:" + f ? "selected" : ""}>${esc(t("f_" + f))}</option>`).join("")}</optgroup>
        <optgroup label="${esc(t("product"))}">${E.skus.map((s) => `<option value="${s.id}" ${sel === s.id ? "selected" : ""}>${esc(skuName(s))}</option>`).join("")}</optgroup>
      </select></div></div>
    <div class="kpis">

// Market (all wholesalers): one row per format with its SKUs under it, then the market total.
function marketTable() {
  const line = (label, a, n, cls) => `<tr class="${cls}"><td>${label}</td><td class="r num">${n || "—"}</td>
    <td class="r num">${a.counted ? fmt(a.delTo) : "—"}</td><td class="r num">${a.counted ? fmt(a.stock) : "—"}</td>
    <td class="r num">${a.counted ? `<b>${fmt(a.off)}</b>` : `<span class="muted small">${esc(t("notCounted"))}</span>`}</td>
    <td class="r num">${a.counted ? pct(a.delTo ? a.off / a.delTo : null) : "—"}</td><td class="r num">${a.counted ? fmt1(a.rate) : "—"}</td>
    </tr>`;
  let body = "";

    const skus = E.skus.filter((s) => fmtOf(s) === f && allRows((r) => r.sku.id === s.id).some((r) => r.everDel > 0 || r.counted));

    <thead><tr><th>${esc(t("format"))} / ${esc(t("product"))}</th><th class="r">${esc(t("kWs"))}</th><th class="r">${esc(t("delivered"))}</th><th class="r">${esc(t("kStock"))}</th><th class="r">${esc(t("offtake"))}</th><th class="r">${esc(t("sellThrough"))}</th><th class="r">${esc(t("perDay"))}</th></tr></thead>

}

/* ---------- analysis: next orders per wholesaler ---------- */
// A product line is one product in any pack: the LB-warning pack stands in for the plain one.
const lineOf = (s) => s.en.replace(/\(LB Warn\)/i, "").replace(/\bBlk\b/i, "Black").replace(/\b(Cruz|KF|Kilo|Kg|50g|250g)\b/gi, "").replace(/\s+/g, " ").trim().toLowerCase() + "|" + fmtOf(s);
const STATUS_RANK = { low: 0, overdue: 1, due: 2, ok: 3, lapsed: 4, none: 5 };
const STATUS_CHIP = { low: "c-crit", overdue: "c-serious", due: "c-warn", ok: "c-good", lapsed: "c-crit", none: "" };
const STATUS_EN = { low: "Low stock", overdue: "Overdue", due: "Due now", ok: "On track", lapsed: "Lapsed", none: "No orders yet" };
const BASIS_EN = { history: "Usual (order history)", count: "Stock count", new: "New flavour", back: "Flavour brought back" };
const median = (a) => { if (!a.length) return null; const b = [...a].sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const round5 = (n) => Math.round(n / 5) * 5;
const floor5 = (n) => Math.floor(n / 5) * 5;
const addDays = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);

// Main-warehouse stock in hand per product: everything received minus everything that left (sales, plus any adjustment out).
function stockInHand() {
  const sold = new Map();
  for (const r of S.ledger.rows) if (r[2] === "Sales Invoice") { const id = S.ledger.skus[r[0]].id; sold.set(id, (sold.get(id) || 0) + r[6]); }
  return E.wh.map((x) => { const s = sold.get(x.sku.id) || 0; return { sku: x.sku, received: x.inb, sold: s, other: x.out - s, inHand: Math.max(0, x.onHand) }; });
}

// One pass over the ledger (and counts) for every wholesaler; cached on E, which recompute() rebuilds.
function nextOrders() {
  if (E._next) return E._next;
  const st = settings(), today = todayISO(), end = E.ledgerEnd;
  const onHand = (s) => Math.max(0, E.whById.get(s.id).onHand), sold = (s) => E.whById.get(s.id).out;
  const skuById = new Map(E.skus.map((s) => [s.id, s]));
  // the pack each product line ships in: the one the warehouse holds most of
  const packFor = new Map();
  for (const s of E.skus) if (onHand(s) > 0) { const k = lineOf(s), cur = packFor.get(k); if (!cur || onHand(s) > onHand(cur)) packFor.set(k, s); }
  const flavours = [...new Set(E.skus.map(flavourOf))];
  const offered = flavours.filter((f) => E.skus.some((s) => flavourOf(s) === f && onHand(s) >= 5));
  const freshOut = flavours.filter((f) => !offered.includes(f));
  const marketGap = Math.round(median(E.wsList.filter((w) => w.avgGap).map((w) => w.avgGap)) || 14);
  const sizes = [];
  const base = E.wsList.map((w) => {
    const dm = E.del.get(w.id) || new Map();
    const byDay = new Map();
    for (const arr of dm.values()) for (const [d, q] of arr) byDay.set(d, (byDay.get(d) || 0) + q);
    const days = [...byDay.keys()].sort();
    const typical = days.length ? median(days.slice(-3).map((d) => byDay.get(d))) : null;
    if (typical) sizes.push(typical);
    return { w, dm, days, typical };
  });
  const marketTypical = median(sizes) || 0;
  const list = base.map(({ w, dm, days, typical }) => {
    const size = typical || marketTypical;
    // mix: the last 90 days of the ledger, or all of it for a wholesaler who bought nothing in that window
    const mixFrom = (from) => { const m = new Map(); let tot = 0; for (const [sid, arr] of dm) for (const [d, q] of arr) if (d >= from) { const s = skuById.get(sid), k = lineOf(s), cur = m.get(k) || { q: 0, rep: s, repQ: 0 }; cur.q += q; if (q > cur.repQ) { cur.rep = s; cur.repQ = q; } m.set(k, cur); tot += q; } return { m, tot }; };
    let mix = mixFrom(addDays(end, -90)); if (!mix.tot) mix = mixFrom("0000");
    // where the stock was counted, the count decides: target days of offtake minus the stock they hold
    const cnt = new Map();
    for (const r of w.skuRows) if (r.counted && r.rate != null) {
      const k = lineOf(r.sku), c = cnt.get(k) || { need: 0, lows: [], rep: r.sku };
      c.need += st.targetDays * r.rate - r.estNow;
      if (r.daysLeft != null && r.daysLeft < st.lowDays) c.lows.push({ sku: r.sku, days: Math.max(0, Math.round(r.daysLeft)) });
      cnt.set(k, c);
    }
    const lines = [], soldOut = [];
    for (const k of new Set([...mix.m.keys(), ...cnt.keys()])) {
      const h = mix.m.get(k), c = cnt.get(k), pack = packFor.get(k);
      const want = c ? ceil5(Math.max(0, c.need)) : Math.max(5, round5(size * h.q / mix.tot));
      if (!pack) { if (h) soldOut.push(h.rep); continue; }
      if (want > 0) lines.push({ sku: pack, want, src: c ? "count" : "history" });
    }
    lines.sort((a, b) => b.want - a.want);
    // the full range: every flavour the warehouse has goes into the order, unless his counted stock already covers it
    const lastOf = new Map();
    for (const [sid, arr] of dm) { const f = flavourOf(skuById.get(sid)), d = arr.at(-1)[0]; if (!lastOf.has(f) || d > lastOf.get(f)) lastOf.set(f, d); }
    const fv = new Map(); for (const [sid, arr] of dm) { const f = fmtOf(skuById.get(sid)); fv.set(f, (fv.get(f) || 0) + arr.reduce((a, x) => a + x[1], 0)); }
    const mainFmt = [...fv].sort((a, b) => b[1] - a[1])[0]?.[0] || "cruz";
    const addQty = Math.min(50, Math.max(5, round5(size * 0.05)));
    const inOrder = new Set(lines.map((l) => flavourOf(l.sku)));
    const covered = new Set([...cnt.values()].filter((c) => c.need <= 0).map((c) => flavourOf(c.rep)));
    const stocked = [];
    for (const f of offered) {
      if (inOrder.has(f)) continue;
      if (covered.has(f)) { stocked.push(f); continue; }
      const c = E.skus.filter((s) => flavourOf(s) === f && onHand(s) >= 5).sort((a, b) => (fmtOf(b) === mainFmt) - (fmtOf(a) === mainFmt) || sold(b) - sold(a));
      lines.push({ sku: c[0], want: addQty, src: lastOf.has(f) ? "back" : "new", flavour: f, lastBought: lastOf.get(f) || null });
    }
    const last = days.at(-1) || null, since = last ? dayDiff(last, today) : null;
    const lastLines = last ? [...dm].map(([sid, arr]) => ({ sku: skuById.get(sid), qty: arr.filter((x) => x[0] === last).reduce((a, x) => a + x[1], 0) })).filter((x) => x.qty > 0).sort((a, b) => b.qty - a.qty) : [];
    const gap = w.avgGap ? Math.round(w.avgGap) : null, g = gap || marketGap;
    const lows = [...cnt.values()].filter((c) => c.need > 0).flatMap((c) => c.lows).sort((x, y) => x.days - y.days);
    const status = !last ? "none" : lows.length ? "low" : since > 90 ? "lapsed" : since > 1.5 * g ? "overdue" : since >= g ? "due" : "ok";
    let a = 0, b = 0; const c1 = addDays(end, -60), c2 = addDays(end, -120);
    for (const arr of dm.values()) for (const [d, q] of arr) { if (d > c1) a += q; else if (d > c2) b += q; }
    return { w, status, last, since, gap, nextDue: last ? addDays(last, g) : null, typical, lines, soldOut, stocked, lows, lastLines, lastTotal: lastLines.reduce((s, x) => s + x.qty, 0), trend: { a, b }, counted: cnt.size > 0 };
  });
  list.sort((x, y) => STATUS_RANK[x.status] - STATUS_RANK[y.status] || y.w.totalDel - x.w.totalDel);
  // Share each product out from the stock in hand. The list is already in order of urgency,
  // so when orders want more than the warehouse holds, each is cut in proportion and the most urgent get the remainder.
  const byS = new Map();
  for (const o of list) for (const l of o.lines) { l.qty = l.want; if (!byS.has(l.sku.id)) byS.set(l.sku.id, []); byS.get(l.sku.id).push(l); }
  for (const [id, ls] of byS) {
    const want = ls.reduce((s, l) => s + l.want, 0), cap = floor5(onHand(skuById.get(id)));
    if (want <= cap) continue;
    for (const l of ls) l.qty = floor5((l.want * cap) / want);
    let rem = cap - ls.reduce((s, l) => s + l.qty, 0);
    while (rem >= 5) { let moved = false; for (const l of ls) if (rem >= 5 && l.qty < l.want) { l.qty += 5; rem -= 5; moved = true; } if (!moved) break; }
  }
  for (const o of list) { o.total = o.lines.reduce((s, l) => s + l.qty, 0); o.wantTotal = o.lines.reduce((s, l) => s + l.want, 0); }
  const stock = stockInHand().map((x) => { const ls = byS.get(x.sku.id) || []; const alloc = ls.reduce((s, l) => s + l.qty, 0); return { ...x, wanted: ls.reduce((s, l) => s + l.want, 0), alloc, left: x.inHand - alloc }; })
    .sort((a, b) => (b.inHand > 0) - (a.inHand > 0) || b.inHand - a.inHand || b.sold - a.sold);
  E._next = { list, byId: new Map(list.map((o) => [o.w.id, o])), freshOut, stock, marketGap };
  return E._next;
}
const trendTxt = (o) => (o.trend.b ? (o.trend.a >= o.trend.b ? "↑ +" : "↓ ") + Math.round(((o.trend.a - o.trend.b) / o.trend.b) * 100) + "%" : o.trend.a ? t("trendNew") : "—");
const rhythm = (o) => [
  `${t("lastOrd")}: ${fmtDate(o.last)} · ${t("daysAgo", o.since)}`,
  o.gap ? t("everyN", o.gap) : t("oneOrder"),
  o.status === "lapsed" ? null : t("nextDue", fmtShort(o.nextDue)),
].filter(Boolean).join(" · ");
const lowsTxt = (o) => (o.lows.length ? t("lowOn", o.lows.map((x) => t("lowItem", skuName(x.sku), x.days)).join(" · ")) : "");
const emptyTxt = (o) => t(o.soldOut.length ? "onlySoldOut" : "nothingToOrder");
const lineNotes = (l) => [
  l.src === "count" ? t("tagCount") : null,
  l.src === "new" ? t("neverBought2") : null,

].filter(Boolean).join(" · ");
const plRow = (name, qty, note) => `<div class="pl"><span><span dir="auto">${esc(name)}</span>${note ? `<span class="pn2">${esc(note)}</span>` : ""}</span><b class="num">${fmt(qty)}</b></div>`;
// The suggested order as two lists: the usual products, then the flavours added to complete the range.
function orderLists(o) {
  const usual = o.lines.filter((l) => l.src === "history" || l.src === "count"), extra = o.lines.filter((l) => l.src === "new" || l.src === "back");
  return `${usual.length ? usual.map((l) => plRow(skuName(l.sku), l.qty, lineNotes(l))).join("") : `<div class="small muted" style="padding:4px 0">${esc(emptyTxt(o))}</div>`}

    ${o.stocked.length ? `<div class="small muted" style="padding-top:6px">${esc(t("stockedNote", o.stocked.join(", ")))}</div>` : ""}`;
}
function nextCard(o) {

// Stock in hand at the main warehouse, and how much of it the next orders take.
function stockTable(rows) {
  const tot = rows.reduce((a, x) => ({ received: a.received + x.received, sold: a.sold + x.sold, inHand: a.inHand + x.inHand, wanted: a.wanted + x.wanted, alloc: a.alloc + x.alloc, left: a.left + x.left }), { received: 0, sold: 0, inHand: 0, wanted: 0, alloc: 0, left: 0 });
  return `<table class="mkt"><thead><tr><th>${esc(t("product"))}</th><th class="r">${esc(t("received_"))}</th><th class="r">${esc(t("colSold"))}</th><th class="r">${esc(t("colInHand"))}</th><th class="r">${esc(t("colWanted"))}</th><th class="r">${esc(t("colAlloc"))}</th><th class="r">${esc(t("colLeft"))}</th></tr></thead><tbody>
    ${rows.map((x) => `<tr><td><span class="name">${esc(skuName(x.sku))}</span><span class="sub2">${esc(skuAlt(x.sku))}</span></td><td class="r num">${fmt(x.received)}</td><td class="r num">${fmt(x.sold)}</td>

// Generic stacked monthly columns with hover tooltip.
function drawStacked(host, M, series, title) {
  if (!host || !M.length) return;
  const tot = M.map((_, i) => series.reduce((a, s) => a + s.values[i], 0));
  const maxV = Math.max(1, ...tot), step = maxV > 16000 ? 5000 : maxV > 8000 ? 4000 : maxV > 4000 ? 2000 : maxV > 1000 ? 500 : 100, top = Math.ceil((maxV * 1.08) / step) * step || step;
  const W = 720, H = 290, m = { l: 56, r: 12, t: 22, b: 30 }, pw = W - m.l - m.r, ph = H - m.t - m.b, band = pw / M.length, bw = Math.min(26, band * 0.6);
  const y = (v) => m.t + ph - (v / top) * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
  for (let v = 0; v <= top; v += step) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(${v ? "--hair" : "--axis"})"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  M.forEach((mo, i) => {
    const cx = m.l + band * i + band / 2, x = cx - bw / 2; let acc = 0;
    const segs = series.map((se) => ({ c: se.color, v: se.values[i] })).filter((d) => d.v > 0);
    segs.forEach((d, j) => { const y0 = y(acc) - (j ? 2 : 0), y1 = y(acc + d.v); acc += d.v; const h = y0 - y1; if (h <= 0) return; const r = j === segs.length - 1 ? Math.min(4, h) : 0; s += `<path d="M${x} ${y0} V${y1 + r} Q${x} ${y1} ${x + r} ${y1} H${x + bw - r} Q${x + bw} ${y1} ${x + bw} ${y1 + r} V${y0} Z" fill="var(${d.c})"/>`; });
    if (tot[i]) s += `<text x="${cx}" y="${y(tot[i]) - 7}" text-anchor="middle" class="val">${fmt(tot[i])}</text>`;
    s += `<text x="${cx}" y="${H - m.b + 18}" text-anchor="middle">${esc(monthLabel(mo))}</text><rect x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ph}" fill="transparent" data-i="${i}" tabindex="0"/>`;
  });
  host.innerHTML = s + "</svg>";
  host.querySelectorAll("rect[data-i]").forEach((r) => {
    const i = +r.dataset.i;
    const html = () => `<div class="t">${esc(monthLabel(M[i]))} ${M[i].slice(0, 4)}</div>` + series.map((se) => `<div class="rw"><span><span class="sw" style="background:var(${se.color});width:9px;height:9px"></span> ${esc(se.label)}</span><span class="num">${fmt(se.values[i])}</span></div>`).join("") + `<div class="rw" style="border-top:1px solid var(--hair);margin-top:4px;padding-top:4px;font-weight:600"><span>${esc(t("total"))}</span><span class="num">${fmt(tot[i])}</span></div>`;
    r.addEventListener("mousemove", (e) => showTip(html(), e.clientX, e.clientY)); r.addEventListener("mouseleave", hideTip);
    r.addEventListener("focus", () => { const b = r.getBoundingClientRect(); showTip(html(), b.right, b.top + 30); }); r.addEventListener("blur", hideTip);
  });
}
// Short flavour label for a column that already sits under its pack-size group.
function flavourLabel(s) {
  const lb = /LB Warn/i.test(s.en);
  if (LANG === "ar") return s.ar.replace(/^فاخر\s*/, "").replace(/تحذير\s*لبن?ان/, "").replace(/(^|\s)(كروز|كف|كيلو)(?=\s|$)/g, " ").replace(/\s+/g, " ").trim() + (lb ? " · لبنان" : "");
  return s.en.replace(/\(LB Warn\)/i, "").replace(/\b(Cruz|KF|Kilo|Kg|50g|250g)\b/gi, "").replace(/\s+/g, " ").trim() + (lb ? " · LB" : "");
}
function drawMatrix() {
  const groups = FORMATS.map((f) => ({ f, items: E.skus.filter((s) => fmtOf(s) === f) })).filter((g) => g.items.length);
  const flat = groups.flatMap((g) => g.items);
  const bin = (v) => (v >= 1000 ? 5 : v >= 500 ? 4 : v >= 200 ? 3 : v >= 50 ? 2 : 1);
  const short = (v) => (v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k" : fmt(v));
  const list = E.wsList.filter((w) => w.totalDel > 0);
  let h = `<thead><tr><th></th>${groups.map((g) => `<th class="grp" colspan="${g.items.length}">${esc(t("f_" + g.f))}</th>`).join("")}</tr><tr><th></th>${flat.map((s) => `<th title="${esc(skuName(s))}">${esc(flavourLabel(s))}<span class="dot ${E.whById.get(s.id).onHand > 0 ? "in" : "out"}"></span></th>`).join("")}</tr></thead><tbody>`;
  h += list.map((w) => `<tr><th class="rowh ar" dir="auto" scope="row" data-n="${w.id}"></th>${flat.map((s) => { const v = w.skuRows.find((r) => r.sku.id === s.id).everDel; return v ? `<td class="b${bin(v)} num" title="${esc(skuName(s))}: ${fmt(v)} MC">${short(v)}</td>` : `<td title="${esc(t("mxNever"))}">·</td>`; }).join("")}</tr>`).join("") + "</tbody>";
  const tb = document.getElementById("mx"); tb.innerHTML = h;
  tb.querySelectorAll("th[data-n]").forEach((th) => (th.textContent = E.wsById.get(th.dataset.n).name));
  document.getElementById("mxLeg").innerHTML = ["1–49", "50–199", "200–499", "500–999", "1,000+"].map((l, i) => `<span><span class="sw" style="background:var(--m${i + 1})"></span>${l}</span>`).join("") + ` <span class="muted">${esc(t("mcDel"))}</span>`
    + `<span><span class="sw" style="background:var(--sunk);text-align:center;line-height:12px;font-size:11px">·</span>${esc(t("mxNever"))}</span><span><span class="dot in" style="margin:0"></span>${esc(t("mxIn"))}</span><span><span class="dot out" style="margin:0"></span>${esc(t("mxOut"))}</span>`;
}

function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error("xlsx library failed to load")); document.head.appendChild(s); });
}
async function onImportFile(e) {
  const file = e.target.files?.[0]; if (!file) return;
  const out = document.getElementById("impOut"); out.innerHTML = `<p class="muted">${esc(t("loading"))}</p>`;
  try {
    const XLSX = await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const ws = wb.Sheets["All Movements"]; if (!ws) throw new Error("sheet");
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
    const hi = aoa.findIndex((r) => r && r[0] === "SKU (EN)"); if (hi < 0) throw new Error("header");
    const H = aoa[hi], col = (n) => H.indexOf(n);
    for (const need of ["SKU (EN)", "SKU (AR)", "Date", "Transaction Type (EN)", "WS (grouped)", "Inbound", "Outbound"]) if (col(need) < 0) throw new Error("col");
    const toISO = (v) => typeof v === "number" ? new Date(Date.UTC(1899, 11, 30) + v * 864e5).toISOString().slice(0, 10) : v instanceof Date ? v.toISOString().slice(0, 10) : /^\d{4}-\d{2}-\d{2}/.test(String(v)) ? String(v).slice(0, 10) : null;
    const slug = (s) => s.toLowerCase().replace(/[()]/g, "").replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const skus = [], idx = new Map(), rows = [];
    for (const r of aoa.slice(hi + 1)) {
      if (!r || !r[col("SKU (EN)")]) continue; const d = toISO(r[col("Date")]); if (!d) continue;
      const en = canonSku(String(r[col("SKU (EN)")]));
      if (!idx.has(en)) { idx.set(en, skus.length); skus.push({ id: slug(en), en, ar: String(r[col("SKU (AR)")] ?? "").trim(), src: String(r[col("Source")] ?? "") }); }
      rows.push([idx.get(en), d, String(r[col("Transaction Type (EN)")] ?? "").trim(), r[col("WS (grouped)")] ? String(r[col("WS (grouped)")]).trim() : "", r[col("Ref")] == null ? "" : String(r[col("Ref")]), +r[col("Inbound")] || 0, +r[col("Outbound")] || 0]);
    }
    if (!rows.length) throw new Error("rows");
    const sales = rows.filter((r) => r[2] === "Sales Invoice"), dates = rows.map((r) => r[1]).sort();
    out.innerHTML = `<div class="notice">${esc(t("importPreview", fmt(rows.length), fmt(sales.length), fmt(sales.reduce((a, r) => a + r[6], 0)), new Set(sales.map((r) => r[3]).filter(Boolean)).size, fmtDate(dates[0]), fmtDate(dates.at(-1))))}</div><div style="margin-top:10px"><button class="btn pri" type="button" id="impGo">${esc(t("importConfirm"))}</button></div>`;
    document.getElementById("impGo").addEventListener("click", async (ev) => {
      ev.currentTarget.disabled = true;
      try {
        const CH = 1500, chunks = Math.ceil(rows.length / CH), old = S.meta?.chunks || 0;
        for (let i = 0; i < chunks; i++) await S.db.doc("ledger/rows-" + i).set({ rows: rows.slice(i * CH, (i + 1) * CH) });
        await S.db.doc("ledger/meta").set({ v: 1, source: file.name, importedAt: new Date().toISOString(), rowCount: rows.length, chunks, skus, cols: ["sku", "date", "type", "ws", "ref", "in", "out"] });
        for (let i = chunks; i < old; i++) await S.db.doc("ledger/rows-" + i).delete();
        out.innerHTML = ""; toast(t("imported"));
      } catch (err) { out.innerHTML = `<div class="notice crit">${esc(t("err") + (err.code || err.message))}</div>`; }
    });
  } catch (err) { out.innerHTML = `<div class="notice crit">${esc(err.message === "xlsx library failed to load" ? t("err") + err.message : t("importErr"))}</div>`; }
  e.target.value = "";
}
async function exportXlsx() {
  if (!S.dl) { toast(t("err") + "downloads unavailable"); return; }
  try {
    const XLSX = await loadXLSX();
    const wb = XLSX.utils.book_new();
    const byWs = [["Wholesaler", "Last count", "Delivered to count dates (MC)", "Stock at last count (MC)", "Offtake to date (MC)", "Sell-through", "Offtake per day (MC)", "Est. days left", "Checks"]];
    for (const w of E.wsList) if (w.lastCount) byWs.push([w.name, w.lastCount.date, w.delTo, w.stock, w.offToDate, w.delTo ? w.offToDate / w.delTo : null, w.rate, w.rate > 0 ? w.estNow / w.rate : null, w.flags]);
    const fmtEn = { cruz: "50g", kf: "250g", kilo: "Kg" };
    const byFmt = [["Wholesaler", ...FORMATS.map((f) => fmtEn[f] + " offtake (MC)"), "Total offtake (MC)"]];
    for (const w of E.wsList) if (w.lastCount) byFmt.push([w.name, ...FORMATS.map((f) => { const a = agg(w.skuRows.filter((r) => fmtOf(r.sku) === f)); return a.counted ? a.off : null; }), agg(w.skuRows).off]);
    byFmt.push(["MARKET TOTAL", ...FORMATS.map((f) => { const a = agg(allRows((r) => fmtOf(r.sku) === f)); return a.counted ? a.off : null; }), agg(allRows(() => true)).off]);
    const market = [["Format", "SKU (EN)", "SKU (AR)", "Wholesalers counted", "Delivered to count dates (MC)", "Stock at wholesalers (MC)", "Offtake to date (MC)", "Sell-through", "Offtake per day (MC)"]];
    for (const f of FORMATS) {
      const fa = agg(allRows((r) => fmtOf(r.sku) === f)); if (!fa.counted) continue;
      market.push([fmtEn[f], "All " + fmtEn[f], "", wsCountFor((r) => fmtOf(r.sku) === f), fa.delTo, fa.stock, fa.off, fa.delTo ? fa.off / fa.delTo : null, fa.rate]);
      for (const s of E.skus.filter((x) => fmtOf(x) === f)) { const a = agg(allRows((r) => r.sku.id === s.id)); if (a.counted) market.push([fmtEn[f], s.en, s.ar, wsCountFor((r) => r.sku.id === s.id), a.delTo, a.stock, a.off, a.delTo ? a.off / a.delTo : null, a.rate]); }
    }
    const bySku = [["Wholesaler", "Format", "SKU (EN)", "SKU (AR)", "Last count", "Delivered to count date (MC)", "Stock (MC)", "Offtake to date (MC)", "Offtake last period (MC)", "Days in period", "Per day (MC)", "Est. days left", "Suggested order (MC)", "Check"]];
    for (const w of E.wsList) for (const r of w.skuRows) if (r.counted) bySku.push([w.name, fmtEn[fmtOf(r.sku)], r.sku.en, r.sku.ar, r.lastDate, r.delTo, r.stock, r.offToDate, r.lastOff, r.lastDays, r.rate, r.daysLeft, r.suggest, r.flag ? "CHECK" : ""]);
    const log = [["Wholesaler", "Count date", "SKU (EN)", "SKU (AR)", "Previous count (MC)", "Delivered in period (MC)", "Counted (MC)", "Offtake (MC)", "Days", "Note", "Supervisor"]];
    for (const w of E.wsList) for (const c of w.counts) for (const r of w.skuRows) { const p = r.series.find((x) => x.id === c.id); if (p) log.push([w.name, c.date, r.sku.en, r.sku.ar, p.base ? 0 : p.prevV, p.rec, p.v, p.off, p.days, c.note || "", c.supervisorName || ""]); }
    const nx = [["Wholesaler", "Status", "Last order", "Days since last order", "Usually orders every (days)", "Next due", "Last 60 days (MC)", "Previous 60 days (MC)", "Format", "SKU (EN)", "SKU (AR)", "Wanted (MC)", "Suggested (MC)", "Basis"]];
    for (const o of nextOrders().list) {
      const head = [o.w.name, STATUS_EN[o.status], o.last, o.since, o.gap, o.nextDue, o.trend.a, o.trend.b];
      if (!o.lines.length) nx.push([...head, "", "", "", 0, 0, "Nothing to order"]);
      for (const l of o.lines) nx.push([...head, fmtEn[fmtOf(l.sku)], l.sku.en, l.sku.ar, l.want, l.qty, BASIS_EN[l.src]]);
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(nx), "Next orders");
    const sih = [["Format", "SKU (EN)", "SKU (AR)", "Received (MC)", "Sold (MC)", "Other out (MC)", "In hand (MC)", "Next orders want (MC)", "Allocated (MC)", "Left after (MC)"]];
    for (const x of nextOrders().stock) sih.push([fmtEn[fmtOf(x.sku)], x.sku.en, x.sku.ar, x.received, x.sold, x.other, x.inHand, x.wanted, x.alloc, x.left]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sih), "Stock in hand");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(market), "Market by format & SKU");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(byWs), "Offtake by WS");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(byFmt), "WS by format");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(bySku), "Offtake WS x SKU");
    const purch = [["Wholesaler", "Date", "SKU (EN)", "SKU (AR)", "Format", "Ref", "Quantity (MC)"]];
    for (const w of E.wsList) for (const r of purchaseLines(w)) purch.push([w.name, r.date, r.sku.en, r.sku.ar, fmtEn[fmtOf(r.sku)], r.ref || "", r.qty]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(log), "Stock count log");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(purch), "Purchase history");
    const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
    await S.dl.save({ filename: `WS Tracker ${todayISO()}.xlsx`, data: new Blob([buf]) });
    toast(t("exported"));
  } catch (err) { if (err?.code !== "declined") toast(t("err") + (err?.code || err?.message || err)); }
}

/* ============================== boot ============================== */
async function boot() {
  render();
  if (!window.claude || typeof window.claude.use !== "function") { S.noClaude = true; render(); return; }
  const [db, user, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  S.db = db; S.user = user; S.dl = dl;
  if (!db) { S.noClaude = true; render(); return; }
  if (user) {
    const [admin, cw] = await Promise.all([user.canEdit(), user.can("data.write")]);
    S.admin = !!admin; S.canWrite = cw; render();
  }
  let chunkVer = null;
  db.doc("ledger/meta").onSnapshot(async (snap) => {
    S.loaded = true;
    if (!snap.exists) { S.meta = null; S.ledger = null; S.loadErr = null; recompute(); render(); return; }
    const m = snap.data(); S.meta = m;
    const ver = m.importedAt + "|" + m.chunks; if (ver === chunkVer) return; chunkVer = ver;
    try {
      const parts = await Promise.all(Array.from({ length: m.chunks || 1 }, (_, i) => db.doc("ledger/rows-" + i).get()));
      S.ledger = { skus: m.skus, rows: parts.flatMap((p) => (p.exists ? p.data().rows || [] : [])) };
      recompute(); render();
    } catch (err) { S.loadErr = err.code || err.message; render(); }
  }, (err) => { S.loadErr = err.code; render(); });
  db.collection("counts").onSnapshot((snap) => { S.counts = snap.docs.map((d) => ({ id: d.id, ...d.data() })); recompute(); render(); }, (err) => { S.loadErr = err.code; render(); });
  db.doc("config/settings").onSnapshot((snap) => { S.settings = snap.exists ? snap.data() : {}; recompute(); render(); });
  db.doc("config/aliases").onSnapshot((snap) => { S.aliases = snap.exists && snap.data().map && typeof snap.data().map === "object" ? snap.data().map : {}; recompute(); render(); });
  db.doc("config/wholesalers").onSnapshot((snap) => { S.extraWs = snap.exists && Array.isArray(snap.data().extra) ? snap.data().extra : []; recompute(); render(); });
}
boot();
